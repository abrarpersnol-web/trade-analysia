<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Analysia | AI Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">

        <!-- Header -->
        <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-3xl font-extrabold text-emerald-400 tracking-tight">Trade Analysia</h1>
                <p class="text-xs text-slate-400 mt-1">Real-time technical analysis & signal calculations</p>
            </div>
            <div class="flex items-center gap-2">
                <input id="symbol-input" type="text" value="BTCUSDT" class="bg-slate-900 border border-slate-700 text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 uppercase font-mono w-32" />
                <button id="analyze-btn" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm transition">
                    Analyze
                </button>
            </div>
        </header>

        <!-- Main Dashboard Cards -->
        <main class="grid gap-6 md:grid-cols-3">
            
            <!-- Signal Card -->
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl space-y-3">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Overall Signal</span>
                <div id="signal-badge" class="text-3xl font-black text-emerald-400">---</div>
                <div class="text-sm text-slate-300">Confidence: <span id="confidence-val" class="font-bold text-white">--</span></div>
            </div>

            <!-- Indicators Card -->
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl space-y-3">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Technical Metrics</span>
                <div class="flex justify-between items-center text-sm py-1 border-b border-slate-800">
                    <span class="text-slate-400">RSI (14)</span>
                    <span id="rsi-val" class="font-mono font-bold text-slate-200">--</span>
                </div>
                <div class="flex justify-between items-center text-sm py-1">
                    <span class="text-slate-400">Micro Trend</span>
                    <span id="trend-val" class="font-bold text-slate-200">--</span>
                </div>
            </div>

            <!-- Targets Card -->
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl space-y-3">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Calculated Targets</span>
                <div class="text-xs text-slate-400">Entry: <span id="entry-val" class="font-mono text-white block text-sm font-semibold">--</span></div>
                <div class="flex justify-between text-xs pt-1">
                    <span class="text-rose-400 font-semibold">SL: <span id="sl-val" class="font-mono text-white">--</span></span>
                    <span class="text-emerald-400 font-semibold">TP: <span id="tp-val" class="font-mono text-white">--</span></span>
                </div>
            </div>

        </main>
    </div>

    <!-- Frontend JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const analyzeBtn = document.getElementById('analyze-btn');
            const symbolInput = document.getElementById('symbol-input');

            async function runAnalysis() {
                const symbol = symbolInput.value.trim() || 'BTCUSDT';
                analyzeBtn.innerText = 'Calculating...';

                try {
                    const res = await fetch(`/api/analyze?symbol=${symbol}`);
                    const data = await res.json();

                    document.getElementById('signal-badge').innerText = data.signal;
                    document.getElementById('confidence-val').innerText = data.confidence;
                    document.getElementById('rsi-val').innerText = data.rsi;
                    document.getElementById('trend-val').innerText = data.trend;
                    document.getElementById('entry-val').innerText = data.entry_zone;
                    document.getElementById('sl-val').innerText = data.stop_loss;
                    document.getElementById('tp-val').innerText = data.take_profit;
                } catch (err) {
                    console.error('Error fetching data:', err);
                } finally {
                    analyzeBtn.innerText = 'Analyze';
                }
            }

            analyzeBtn.addEventListener('click', runAnalysis);
            runAnalysis(); // Auto-load initial data
        });
    </script>
</body>
</html>
